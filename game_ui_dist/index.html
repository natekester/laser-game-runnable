<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <script type="module" crossorigin src="/assets/index-BDwePOQr.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-cNBiYoxi.css">
  </head>
  <body>
    <div id="error-box" style="display:none; position:fixed; z-index:9999; top:0; left:0; width:100%; padding:20px; background:red; color:white; font-family:monospace; white-space:pre-wrap;"></div>
    <script>
      window.addEventListener('error', function(e) {
        var box = document.getElementById('error-box');
        box.style.display = 'block';
        box.innerText = 'JS Error: ' + e.message + '\nAt: ' + e.filename + ':' + e.lineno + ':' + e.colno + '\n\n' + (e.error ? e.error.stack : '');
      });
      window.addEventListener('unhandledrejection', function(e) {
        var box = document.getElementById('error-box');
        box.style.display = 'block';
        box.innerText = 'Unhandled Promise Rejection: ' + e.reason;
      });
    </script>
    <div id="root"></div>
  </body>
</html>
